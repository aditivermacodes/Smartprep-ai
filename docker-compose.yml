
services:
  server:
    image: aditivermacodes/smartprep-server:latest
    container_name: smartprep-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env

  client:
    image: aditivermacodes/smartprep-client:latest
    container_name: smartprep-client
    ports:
      - "5173:5173"
    depends_on:
      - server

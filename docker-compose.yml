version: "3.9"

services:
  server:
    build:
      context: ./server

    container_name: smartprep-server

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

  client:
    build:
      context: ./client

    container_name: smartprep-client

    ports:
      - "5173:5173"

    depends_on:
      - server
